name: Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
          
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        fetch-depth: 0
    
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync
    
    - name: Configure Git for public repos
      run: |
        git config --global url."https://github.com/".insteadOf git@github.com:
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Sync repositories
      run: |
        #!/bin/bash
        
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        RED='\033[0;31m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}========================================${NC}"
        echo -e "${BLUE}    Multi-Source Sync Started${NC}"
        echo -e "${BLUE}========================================${NC}"
        
        # 定义同步任务
        # 格式: "source_repo|branch|type|source_path|target_path"
        # type: "dir" 表示目录克隆, "full" 表示整仓库克隆
        # 对于 usteer-ng，使用 "dir" 类型并指定子目录路径
        SYNC_TASKS=(
          # 普通的整仓库同步
          "https://github.com/torguardvpn/luci-app-easymesh|main|full||luci-app-easymesh"
          "https://github.com/sirpdboy/luci-app-advancedplus|main|full||luci-app-advancedplus"
          
          # 从 VIKINGYFY/packages 同步多个目录
          "https://github.com/VIKINGYFY/packages|main|dir|gecoosac luci-app-gecoosac luci-app-wolultra|"
          
          # usteer-ng: 同步子目录 openwrt/usteer-ng 到 usteer-ng
          "https://github.com/NilsRo/usteer-ng|development|dir|openwrt/usteer-ng|usteer-ng"
        )
        
        mkdir -p temp_sync
        
        for task in "${SYNC_TASKS[@]}"; do
          IFS='|' read -r REPO BRANCH TYPE SOURCE_DIRS TARGET_BASE <<< "$task"
          
          echo -e "\n${YELLOW}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
          echo -e "Processing: ${BLUE}$REPO${NC} (type: $TYPE)"
          echo -e "${YELLOW}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
          
          TEMP_DIR="temp_sync/$(echo $REPO | md5sum | cut -c1-8)"
          
          echo "📦 Cloning repository..."
          
          # 尝试克隆
          if git clone --depth 1 --single-branch --branch $BRANCH $REPO $TEMP_DIR 2>&1; then
            echo -e "${GREEN}✓ Clone successful${NC}"
          else
            echo "  Trying with PAT authentication..."
            REPO_NAME=$(basename $REPO .git)
            AUTH_REPO="https://YunHair:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/NilsRo/${REPO_NAME}.git"
            
            if git clone --depth 1 --single-branch --branch $BRANCH $AUTH_REPO $TEMP_DIR 2>&1; then
              echo -e "${GREEN}✓ Clone successful with PAT${NC}"
            else
              echo -e "${RED}✗ Clone failed, skipping...${NC}"
              continue
            fi
          fi
          
          case $TYPE in
            "dir")
              # 处理多个目录
              IFS=' ' read -ra DIRS <<< "$SOURCE_DIRS"
              
              for SOURCE_PATH in "${DIRS[@]}"; do
                [ -z "$SOURCE_PATH" ] && continue
                
                # 检查是否包含映射
                if [[ $SOURCE_PATH == *":"* ]]; then
                  SRC="${SOURCE_PATH%:*}"
                  TGT="${SOURCE_PATH#*:}"
                else
                  SRC="$SOURCE_PATH"
                  TGT="$SOURCE_PATH"
                fi
                
                # 构建目标路径
                if [ -n "$TARGET_BASE" ]; then
                  TARGET_PATH="$TARGET_BASE/$TGT"
                else
                  TARGET_PATH="$TGT"
                fi
                
                echo -e "  📁 Syncing: $SRC -> $TARGET_PATH"
                
                if [ -d "$TEMP_DIR/$SRC" ]; then
                  mkdir -p "$TARGET_PATH"
                  rsync -av --delete "$TEMP_DIR/$SRC/" "$TARGET_PATH/" > /dev/null 2>&1
                  FILE_COUNT=$(find "$TARGET_PATH" -type f 2>/dev/null | wc -l)
                  echo -e "  ${GREEN}✓ Synced! Files: $FILE_COUNT${NC}"
                  
                  # 如果是 usteer-ng，显示修复信息
                  if [[ "$TARGET_PATH" == "usteer-ng" ]]; then
                    echo -e "  ℹ️  usteer-ng synced from subdirectory: openwrt/usteer-ng"
                  fi
                else
                  echo -e "  ${RED}✗ Source not found: $SRC${NC}"
                  
                  # 显示可用目录帮助调试
                  if [[ "$REPO" == *"usteer-ng"* ]]; then
                    echo -e "  Available directories in repo:"
                    find "$TEMP_DIR" -type d -name "usteer-ng" 2>/dev/null | head -5
                    echo -e "  Full directory structure (first 3 levels):"
                    find "$TEMP_DIR" -type d -maxdepth 3 2>/dev/null | head -10
                  fi
                fi
              done
              ;;
            
            "full")
              TARGET_PATH="$TARGET_BASE"
              echo -e "  📦 Syncing full repository to: $TARGET_PATH"
              
              if [ -d "$TEMP_DIR" ]; then
                mkdir -p "$TARGET_PATH"
                rsync -av --delete --exclude='.git' "$TEMP_DIR/" "$TARGET_PATH/" > /dev/null 2>&1
                FILE_COUNT=$(find "$TARGET_PATH" -type f 2>/dev/null | wc -l)
                echo -e "  ${GREEN}✓ Full repo synced! Files: $FILE_COUNT${NC}"
              else
                echo -e "  ${RED}✗ Source repository not found${NC}"
              fi
              ;;
          esac
          
          rm -rf "$TEMP_DIR"
        done
        
        rm -rf temp_sync
        
        echo -e "\n${GREEN}Sync completed!${NC}"
    
    - name: Fix usteer-ng Makefile for OpenWrt compilation
      run: |
        if [ -d "usteer-ng" ]; then
          echo "📝 Fixing usteer-ng Makefile..."
          
          # 检查 Makefile 位置
          if [ -f "usteer-ng/Makefile" ]; then
            echo "✅ Makefile found in usteer-ng/"
            
            # 检查 Makefile 内容
            if grep -q "PKG_SOURCE_VERSION" usteer-ng/Makefile; then
              echo "Makefile already has PKG_SOURCE_VERSION"
            else
              echo "⚠️  Makefile may need fixes"
            fi
          else
            echo "❌ Makefile not found in usteer-ng/"
            echo "Listing directory contents:"
            ls -la usteer-ng/
          fi
        else
          echo "⚠️  usteer-ng directory not found"
        fi
    
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        REMOTE_URL="https://YunHair:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/YunHair/openwrt-package.git"
        git remote set-url origin $REMOTE_URL
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT_MSG="Auto sync from multiple sources - $TIMESTAMP"
          
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          COMMIT_MSG="$COMMIT_MSG

          Changed files: $CHANGED_FILES"
          
          echo "Committing $CHANGED_FILES files..."
          git commit -m "$COMMIT_MSG"
          
          echo "Pushing to remote..."
          git push
          
          echo "✓ Changes pushed successfully"
        fi
