name: Sync

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
          
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        fetch-depth: 0
    
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync
    
    - name: Configure Git for public repos
      run: |
        git config --global url."https://github.com/".insteadOf git@github.com:
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Sync repositories
      run: |
        #!/bin/bash
        
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        RED='\033[0;31m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}========================================${NC}"
        echo -e "${BLUE}    Multi-Source Sync Started${NC}"
        echo -e "${BLUE}========================================${NC}"
        
        # ============================================
        # 同步任务配置
        # ============================================
        # 格式: "source_repo|branch|sync_mode|source_path|target_path"
        #
        # sync_mode 类型:
        #   - full: 同步整个仓库（source_path 留空）
        #   - dir: 同步指定目录（source_path 可以是单个目录）
        #   - dirs: 同步多个目录（source_path 用空格分隔）
        #   - subdir: 同步子目录内容到目标目录（source_path 为子目录路径）
        #   - subdirs: 同步多个子目录（source_path 用空格分隔）
        #
        # source_path: 源仓库中的路径
        #   - 对于 subdir: "openwrt/usteer-ng" 
        #   - 对于 dirs: "gecoosac luci-app-gecoosac luci-app-wolultra"
        #   - 对于 full: 留空 ""
        #
        # target_path: 目标仓库中的路径
        #   - 对于 dirs: 目标基础目录
        #   - 对于 subdir: 目标目录
        #   - 对于 full: 目标目录
        # ============================================
        
        SYNC_TASKS=(
          # 示例1: 同步多个目录（从同一仓库）
          "https://github.com/VIKINGYFY/packages|main|dirs|luci-app-wolultra|"
          "https://github.com/laipeng668/luci-app-gecoosac|main|dirs|gecoosac luci-app-gecoosac|"
          "https://github.com/Tokisaki-Galaxy/luci-app-tailscale-community|master|dirs|luci-app-tailscale-community|"
          "https://github.com/kenzok8/small-package|main|dirs|oaf luci-app-oaf wrtbwmon luci-app-wrtbwmon|"
          # "https://github.com/kenzok8/small-package|main|dirs|open-app-filter|   # 文件luci-app-oaf.json 有冲突
          #"https://github.com/gdy666/luci-app-lucky|main|dirs|lucky luci-app-lucky|"
          "https://github.com/destan19/OpenAppFilter|master|dirs|oaf luci-app-oaf open-app-filter|"
          "https://github.com/whzhni1/luci-app-lucky|main|dirs|luci-app-lucky|"
          "https://github.com/whzhni1/luci-app-tailscale|main|dirs|tailscale luci-app-tailscale|"
          
          # 示例3: 同步整个仓库
          "https://github.com/sirpdboy/luci-app-advancedplus|main|full| |luci-app-advancedplus"
          "https://github.com/aimeeacker/luci-app-zerotier|main|full| |luci-app-zerotier"
          "https://github.com/eamonxg/luci-theme-aurora|master|full||luci-theme-aurora"
          "https://github.com/eamonxg/luci-app-aurora-config|master|full||luci-app-aurora-config"

          
          # 示例2: 同步子目录内容到目标目录（适用于 Makefile 在子目录的情况）
          #"https://github.com/NilsRo/usteer-ng|development|subdir|openwrt/usteer-ng|usteer-ng"        

          

          # ============================================
          # 更多示例（注释掉，需要时取消注释）
          # ============================================
        
          # 示例5: 同步单个子目录
          # "https://github.com/example/repo|main|subdir|path/to/subdir|custom-target"
          
          # 示例6: 同步多个子目录到不同目标
          # "https://github.com/example/repo|main|subdirs|subdir1:target1 subdir2:target2 subdir3:target3|"
          
          # 示例7: 同步单个目录（非子目录）
          # "https://github.com/example/repo|main|dir|some-dir|my-dir"
        )
        
        # ============================================
        # 同步处理函数
        # ============================================
        
        # 函数: 克隆仓库
        clone_repo() {
          local REPO=$1
          local BRANCH=$2
          local TEMP_DIR=$3
          
          echo "📦 Cloning repository..."
          
          # 尝试直接克隆
          if git clone --depth 1 --single-branch --branch $BRANCH $REPO $TEMP_DIR 2>&1; then
            echo -e "${GREEN}✓ Clone successful${NC}"
            return 0
          else
            # 尝试使用 PAT
            echo "  Trying with PAT authentication..."
            REPO_NAME=$(basename $REPO .git)
            AUTH_REPO="https://YunHair:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${REPO_NAME}.git"
            
            if git clone --depth 1 --single-branch --branch $BRANCH $AUTH_REPO $TEMP_DIR 2>&1; then
              echo -e "${GREEN}✓ Clone successful with PAT${NC}"
              return 0
            else
              echo -e "${RED}✗ Clone failed${NC}"
              return 1
            fi
          fi
        }
        
        # 函数: 同步目录
        sync_directory() {
          local SRC=$1
          local TGT=$2
          local TEMP_DIR=$3
          
          echo -e "  📁 Syncing: $SRC -> $TGT"
          
          if [ -d "$TEMP_DIR/$SRC" ]; then
            mkdir -p "$TGT"
            rsync -av --delete "$TEMP_DIR/$SRC/" "$TGT/" > /dev/null 2>&1
            FILE_COUNT=$(find "$TGT" -type f 2>/dev/null | wc -l)
            echo -e "  ${GREEN}✓ Synced! Files: $FILE_COUNT${NC}"
            return 0
          else
            echo -e "  ${RED}✗ Source not found: $SRC${NC}"
            return 1
          fi
        }
        
        # ============================================
        # 主处理循环
        # ============================================
        
        mkdir -p temp_sync
        FAILED_TASKS=()
        
        for task in "${SYNC_TASKS[@]}"; do
          IFS='|' read -r REPO BRANCH SYNC_MODE SOURCE_PATHS TARGET_PATH <<< "$task"
          
          echo -e "\n${YELLOW}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
          echo -e "Repository: ${BLUE}$REPO${NC}"
          echo -e "Mode: ${BLUE}$SYNC_MODE${NC}"
          echo -e "Source: $SOURCE_PATHS"
          echo -e "Target: $TARGET_PATH"
          echo -e "${YELLOW}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
          
          # 生成临时目录名
          TEMP_DIR="temp_sync/$(echo $REPO | md5sum | cut -c1-8)"
          
          # 克隆仓库
          if ! clone_repo "$REPO" "$BRANCH" "$TEMP_DIR"; then
            FAILED_TASKS+=("$REPO")
            continue
          fi
          
          # 根据模式执行同步
          case $SYNC_MODE in
            "full")
              # 同步整个仓库
              echo -e "  📦 Syncing full repository to: $TARGET_PATH"
              mkdir -p "$TARGET_PATH"
              rsync -av --delete --exclude='.git' "$TEMP_DIR/" "$TARGET_PATH/" > /dev/null 2>&1
              FILE_COUNT=$(find "$TARGET_PATH" -type f 2>/dev/null | wc -l)
              echo -e "  ${GREEN}✓ Full repo synced! Files: $FILE_COUNT${NC}"
              ;;
            
            "dir")
              # 同步单个目录
              sync_directory "$SOURCE_PATHS" "$TARGET_PATH" "$TEMP_DIR"
              ;;
            
            "dirs")
              # 同步多个目录到同一基础目录
              IFS=' ' read -ra DIRS <<< "$SOURCE_PATHS"
              for SOURCE_PATH in "${DIRS[@]}"; do
                [ -z "$SOURCE_PATH" ] && continue
                
                # 检查是否包含映射 (source:target)
                if [[ $SOURCE_PATH == *":"* ]]; then
                  SRC="${SOURCE_PATH%:*}"
                  TGT="${SOURCE_PATH#*:}"
                else
                  SRC="$SOURCE_PATH"
                  TGT="$SOURCE_PATH"
                fi
                
                # 构建目标路径
                if [ -n "$TARGET_PATH" ]; then
                  FINAL_TARGET="$TARGET_PATH/$TGT"
                else
                  FINAL_TARGET="$TGT"
                fi
                
                sync_directory "$SRC" "$FINAL_TARGET" "$TEMP_DIR"
              done
              ;;
            
            "subdir")
              # 同步子目录内容到目标目录（不保留子目录路径）
              echo -e "  📁 Syncing subdirectory content: $SOURCE_PATHS -> $TARGET_PATH"
              
              if [ -d "$TEMP_DIR/$SOURCE_PATHS" ]; then
                # 清空目标目录（如果需要完全替换）
                rm -rf "$TARGET_PATH"
                mkdir -p "$TARGET_PATH"
                
                # 同步子目录内容
                rsync -av --delete "$TEMP_DIR/$SOURCE_PATHS/" "$TARGET_PATH/" > /dev/null 2>&1
                FILE_COUNT=$(find "$TARGET_PATH" -type f 2>/dev/null | wc -l)
                echo -e "  ${GREEN}✓ Synced! Files: $FILE_COUNT${NC}"
                
                # 如果是 usteer-ng，检查 Makefile
                if [[ "$TARGET_PATH" == *"usteer-ng"* ]]; then
                  if [ -f "$TARGET_PATH/Makefile" ]; then
                    echo -e "  ✅ Makefile found at: $TARGET_PATH/Makefile"
                  fi
                fi
              else
                echo -e "  ${RED}✗ Source subdirectory not found: $SOURCE_PATHS${NC}"
                echo -e "  Available directories:"
                find "$TEMP_DIR" -type d -name "$(basename $SOURCE_PATHS)" 2>/dev/null | head -3
              fi
              ;;
            
            "subdirs")
              # 同步多个子目录到不同目标
              IFS=' ' read -ra ITEMS <<< "$SOURCE_PATHS"
              for item in "${ITEMS[@]}"; do
                [ -z "$item" ] && continue
                
                # 格式: source_path:target_path
                if [[ $item == *":"* ]]; then
                  SRC="${item%:*}"
                  TGT="${item#*:}"
                else
                  SRC="$item"
                  TGT="$item"
                fi
                
                # 如果指定了基础目标路径
                if [ -n "$TARGET_PATH" ]; then
                  FINAL_TARGET="$TARGET_PATH/$TGT"
                else
                  FINAL_TARGET="$TGT"
                fi
                
                sync_directory "$SRC" "$FINAL_TARGET" "$TEMP_DIR"
              done
              ;;
            
            *)
              echo -e "${RED}✗ Unknown sync mode: $SYNC_MODE${NC}"
              ;;
          esac
          
          # 清理临时目录
          rm -rf "$TEMP_DIR"
        done
        
        # 清理临时目录
        rm -rf temp_sync
        
        # 显示结果统计
        echo -e "\n${BLUE}========================================${NC}"
        echo -e "${BLUE}    Sync Summary${NC}"
        echo -e "${BLUE}========================================${NC}"
        
        if [ ${#FAILED_TASKS[@]} -eq 0 ]; then
          echo -e "${GREEN}✓ All tasks completed successfully!${NC}"
        else
          echo -e "${RED}✗ Failed tasks:${NC}"
          for failed in "${FAILED_TASKS[@]}"; do
            echo -e "  - $failed"
          done
        fi
        
        echo -e "\n${GREEN}Sync completed!${NC}"
    
    - name: Fix directory structure if needed
      run: |
        echo "📝 Checking for nested directory issues..."
        
        # 检查并修复可能的多层目录问题
        if [ -d "usteer-ng/openwrt/usteer-ng" ]; then
          echo "⚠️  Found nested directory structure in usteer-ng, fixing..."
          
          # 备份
          mv usteer-ng usteer-ng_backup
          
          # 移动正确的内容
          if [ -d "usteer-ng_backup/openwrt/usteer-ng" ]; then
            mv usteer-ng_backup/openwrt/usteer-ng usteer-ng
          fi
          
          # 清理备份
          rm -rf usteer-ng_backup
          echo "✅ Fixed nested directory structure"
        fi
        
        # 检查其他可能的嵌套目录
        find . -type d -path "*/openwrt/*" -name "usteer-ng" 2>/dev/null | while read -r dir; do
          echo "⚠️  Found nested directory: $dir"
        done
    
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        REMOTE_URL="https://YunHair:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/YunHair/openwrt-package.git"
        git remote set-url origin $REMOTE_URL
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT_MSG="Auto sync from multiple sources - $TIMESTAMP"
          
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          COMMIT_MSG="$COMMIT_MSG

          Changed files: $CHANGED_FILES"
          
          echo "Committing $CHANGED_FILES files..."
          git commit -m "$COMMIT_MSG"
          
          echo "Pushing to remote..."
          git push
          
          echo "✓ Changes pushed successfully"
        fi
